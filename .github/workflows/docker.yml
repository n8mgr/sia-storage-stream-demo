name: Build & push container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    # `packages: write` is what lets the workflow push to ghcr.io.
    # `attestations: write` + `id-token: write` enable build provenance via
    # build-push-action; safe to leave on.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR enforces lowercase image names. github.repository preserves the
      # owner's case (e.g. n8mgr/sia-storage-stream-demo) so it's safe today,
      # but lowercasing here keeps things robust if the repo ever moves to
      # an org with mixed case.
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skip login on PRs from forks — they don't have package write
      # permission anyway and we don't push for those builds.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch covers both x86 servers and Apple Silicon / Graviton.
      # Both base images (oven/bun:1.2-alpine, nginx:alpine) ship native
      # builds for these so QEMU is only needed when one runner is missing.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # GitHub Actions cache keeps incremental builds fast — both the
          # bun install layer and built dist layer survive across runs
          # when only source changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
