server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Belt-and-suspenders: nginx's default mime.types includes
    # application/wasm in 1.21+, but pinning it explicitly means the SDK's
    # WASM file is always served correctly even on older base images.
    types {
        application/wasm wasm;
    }

    # SPA fallback for client-side routing. BrowserRouter renders
    # /watch/:id, so direct navigation and refresh need to serve
    # index.html instead of 404ing on the missing static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The streaming service worker MUST be served fresh — the browser
    # only checks for updates on navigation, and if it gets a stale copy
    # from cache, your range-request hijacking won't update either.
    location = /sia-stream-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # Vite emits hash-named files under /assets/ (e.g. index-CI3XH8nT.js).
    # Their content is immutable for that filename, so cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Gzip for the small text assets. Don't bother with WASM — it's
    # already compressed by Vite's terser/optimizer pass and gzipping it
    # wastes CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
}
